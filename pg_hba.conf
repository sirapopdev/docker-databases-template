# Mounted over the image's pg_hba.conf, so changes apply on restart, not only on first init.
# TYPE   DATABASE     USER  ADDRESS         METHOD

# Unix socket inside the container (docker exec, db.sh)
local    all          all                   trust

# Docker networks: Databasus and other containers, plus host connections to the
# 127.0.0.1 port mapping, which docker-proxy forwards from the bridge gateway.
# ponytail: assumes Docker's default 172.16.0.0/12 pool; add your pool if daemon.json changes it.
host     all          all   172.16.0.0/12   scram-sha-256
host     replication  all   172.16.0.0/12   scram-sha-256

# Everything else (the internet when POSTGRES_BIND=0.0.0.0) must use TLS. No remote replication,
# and no remote superuser: administer through an SSH tunnel. Rename if POSTGRES_USER differs.
hostssl  all          postgres  0.0.0.0/0   reject
hostssl  all          all   0.0.0.0/0       scram-sha-256
