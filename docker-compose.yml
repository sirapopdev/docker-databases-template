services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TLS_HOST: ${POSTGRES_TLS_HOST:-}
    # Starts as root to issue TLS certs into the data volume, then hands over to the image
    # entrypoint, which drops to the postgres user. Clients verify the server with ssl/ca.crt.
    # The server cert is separate from the CA cert because rustls-based clients reject a
    # CA cert presented by the server (CaUsedAsEndEntity).
    # summarize_wal: required by Databasus incremental physical backups (PG17+)
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /var/lib/postgresql/ssl
        cd /var/lib/postgresql/ssl
        host=$$POSTGRES_TLS_HOST
        if [ ! -f ca.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=postgres-ca -keyout ca.key -out ca.crt
          rm -f host
        fi
        # Reissue the server cert when POSTGRES_TLS_HOST changes. The CA stays, so clients keep working.
        if [ "$$(cat host 2>/dev/null || echo -)" != "$$host" ]; then
          case "$$host" in
            "") san= ;;
            *:*) san=IP:$$host ;;
            *[!0-9.]*) san=DNS:$$host ;;
            *) san=IP:$$host ;;
          esac
          printf 'basicConstraints=CA:FALSE\nextendedKeyUsage=serverAuth\n%s\n' "$${san:+subjectAltName=$$san}" > server.ext
          openssl req -newkey rsa:2048 -nodes -subj /CN=postgres -keyout server.key -out server.csr
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 3650 -extfile server.ext -out server.crt
          chown postgres:postgres server.key server.crt
          chmod 600 server.key ca.key
          printf %s "$$host" > host
        fi
        exec docker-entrypoint.sh postgres -c summarize_wal=on -c ssl=on -c ssl_cert_file=/var/lib/postgresql/ssl/server.crt -c ssl_key_file=/var/lib/postgresql/ssl/server.key -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      # IPv4 only on purpose: Docker forwards IPv6 through docker-proxy, which hides the
      # client address and would let internet clients match the Docker-network rules in pg_hba.conf.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18 image keeps data under /var/lib/postgresql/18/docker, so mount the parent
      - postgres-data:/var/lib/postgresql
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  databasus:
    image: databasus/databasus:latest
    container_name: databasus
    restart: unless-stopped
    ports:
      - "${DATABASUS_PORT:-4005}:4005"
    volumes:
      - databasus-data:/databasus-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
  databasus-data:
